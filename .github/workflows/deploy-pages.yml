name: Deploy restaurant site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site/assets/menu
          cp assets/menu/petiscos.jpg assets/menu/pratos-de-mar.jpg assets/menu/sobremesas-da-casa.jpg assets/menu/bebidas-da-casa.jpg _site/assets/menu/
          cp index.html index-cabeca-bagre.html robots.txt sitemap.xml llms.txt CNAME .nojekyll _site/
          cp assets/favicon.svg assets/cabeca-bagre-hero.jpg assets/restaurante-salao.jpg _site/assets/
          cp assets/galeria-petisco-na-mesa.jpg assets/galeria-encontro-na-casa.jpg assets/galeria-moqueca.jpg assets/galeria-prato-e-cliente.jpg assets/galeria-servico-na-mesa.jpg _site/assets/
          cp assets/logo-cabeça-de-bagre-azul.webp assets/logo-cabeça-de-bagre-branco.webp _site/assets/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
